spec_name: "two_rivers"
specs:
    INPUT:
        # Locations
        - "wolf:0...2"  # Updated for two rivers, 0 is left bank, 1 is middle bank, 2 is right bank
        - "goat:0...2"
        - "corn:0...2"
        - "farmer:0...2"

        # FlexBE state outcomes
        - "move_state_c"
        - "move_state_f"
        - "log_failed_c"
        - "begin_game_c"
        - "log_finished_c"

    OUTPUT:
        # State activations
        - "move_state_a"
        - "begin_game_a"
        - "log_failed_a"
        - "log_finished_a"
        - "finished"

        # Output variables (for parameters)
        - "move_dest:0...2"  # 0 is left bank, 1 is middle bank, 2 is right bank
        - "move_item:0...3"  # farmer is 0, then wolf=1, goat=2, corn=3
    ENV_INIT:
        # Only AP_I and Boolean operators
        # Everyone on the left bank
        - "wolf=0"
        - "goat=0"
        - "corn=0"
        - "farmer=0"

        # Initial FlexBE flags
        - "!move_state_c"
        - "!move_state_f"
        - "!log_failed_c"
        - "begin_game_c"
        - "!log_finished_c"

    ENV_TRANS:
        # G(Y) Y: AP_I U AP_O U {Xy: y \in AP_I}

        # Activation of a FlexBE state gets one and only one outcome
        - "move_state_a -> (!move_state_f' | !move_state_c') & (move_state_f' | move_state_c')"
        - "log_failed_a -> log_failed_c'"
        - "log_finished_a -> log_finished_c'"
        - "!begin_game_a -> !begin_game_c'"

        # Negative actions - no output if we don't activate
        - "!move_state_a -> !move_state_c' & !move_state_f'"
        - "!log_failed_a -> !log_failed_c'"
        - "!log_finished_a -> !log_finished_c'"

        # State rules

        # Everyone stays put if move does not complete
        - "!move_state_c' -> (farmer'=farmer)"
        - "!move_state_c' -> (wolf'=wolf)"
        - "!move_state_c' -> (goat'=goat)"
        - "!move_state_c' -> (corn'=corn)"

        # Stay put if not actively being moved
        - "(!move_item=1) -> (wolf'=wolf)"
        - "(!move_item=2) -> (goat'=goat)"
        - "(!move_item=3) -> (corn'=corn)"

        # Movement rules on completion
        - "move_state_c' -> (farmer'=move_dest)"
        - "(move_state_c' & (move_item=1)) -> (wolf'=move_dest)"
        - "(move_state_c' & (move_item=2)) -> (goat'=move_dest)"
        - "(move_state_c' & (move_item=3)) -> (corn'=move_dest)"

    SYS_TRANS:
        # G(Y) Y: AP_I U AP_O U {Xy: y \in AP_I U AP_O}

        # Actions
        - "move_state_a | log_failed_a | log_finished_a | finished"  # Something must be done
        - "!begin_game_a"  # only for starting out

        # Only activate one state at a time
        - "!(move_state_a & (log_failed_a | log_finished_a | finished))"
        - "!(log_failed_a & (move_state_a | log_finished_a | finished))"
        - "!(log_finished_a & (move_state_a | log_failed_a | finished))"
        - "!(finished & (move_state_a | log_failed_a | log_finished_a))"

        # Movement constraints
        # Can only move an item if present with farmer
        - "(!farmer=wolf) -> (!move_item=1)"
        - "(!farmer=goat) -> (!move_item=2)"
        - "(!farmer=corn) -> (!move_item=3)"

        # Farmer must stay with goat if corn or wolf present with goat
        - "(goat'=wolf') -> (farmer'=goat')" # farmer must stay with goat if problem
        - "(goat'=corn') -> (farmer'=goat')"

        # Failure handling
        - "log_failed_c -> !log_failed_a"      # only log once per occurrence
        - "log_finished_c -> !log_finished_a"  # only log once per occurrence
        - "!move_state_f -> !log_failed_a"     # do not log if completed
        - "move_state_f -> log_failed_a"       # Log on failure

        # Completion
        - "finished -> finished'"  # once finished, stay finished

        # If we finish on next step, then immediately log finished
        - "!(wolf=2 & goat=2 & corn=2) & (wolf'=2 & goat'=2 & corn'=2) -> log_finished_a'"
        - "!(wolf=2 & goat=2 & corn=2) -> !log_finished_a & !finished"
        - "log_finished_c -> finished"

        # The farmer is always on the go
        #- "move_dest!=farmer"  # the below statements reduce state count more than this one
        - "(farmer=0) -> (move_dest=1)"
        - "(farmer=1) -> (move_dest=2 | move_dest=0)"
        - "(farmer=2) -> (move_dest=1)"

    SYS_LIVENESS:
        # Either we finish or eventually the move will complete to change state of world
        - "finished | !(move_state_a & (move_item=0) -> move_state_c') | !(move_state_a & (move_item=1) -> move_state_c') | !(move_state_a & (move_item=2) -> move_state_c') | !(move_state_a & (move_item=3) -> move_state_c')"
