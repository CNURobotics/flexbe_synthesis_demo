# This spec file is for the two_rivers_capability demo
# It includes only environmental specs
# All FlexBE system capabilities specifications are auto generated by pipeline
spec_name: "two_rivers"
specs:
    # For this demo, the INPUT and OUTPUT variables are defined by capabilities and variable mappings
    ENV_INIT:
        - "wolf=0"
        - "goat=0"
        - "corn=0"
        - "farmer=0"

    ENV_TRANS:
        # G(Y) Y: AP_I U AP_O U {Xy: y \in AP_I}

        # State rules for environment variables
        # Everyone stays put if move does not complete
        - "!move_state_c' -> (farmer'=farmer)"
        - "!move_state_c' -> (wolf'=wolf)"
        - "!move_state_c' -> (goat'=goat)"
        - "!move_state_c' -> (corn'=corn)"

        # Stay put if not actively being moved
        - "(!move_item=1) -> (wolf'=wolf)"
        - "(!move_item=2) -> (goat'=goat)"
        - "(!move_item=3) -> (corn'=corn)"

        # Movement rules on completion
        - "move_state_c' -> (farmer'=move_dest)"
        - "(move_state_c' & (move_item=1)) -> (wolf'=move_dest)"
        - "(move_state_c' & (move_item=2)) -> (goat'=move_dest)"
        - "(move_state_c' & (move_item=3)) -> (corn'=move_dest)"

    SYS_TRANS:
        # G(Y) Y: AP_I U AP_O U {Xy: y \in AP_I U AP_O}

        # Movement constraints
        # Can only move an item if present with farmer
        - "(!farmer=wolf) -> (!move_item=1)"
        - "(!farmer=goat) -> (!move_item=2)"
        - "(!farmer=corn) -> (!move_item=3)"

        # Farmer must stay with goat if corn or wolf present with goat
        - "(goat'=wolf') -> (farmer'=goat')" # farmer must stay with goat if problem
        - "(goat'=corn') -> (farmer'=goat')"

        # The farmer is always on the go
        - "move_dest!=farmer"             # this statement is redundant with next 3
        - "(farmer=0) -> (move_dest=1)"
        - "(farmer=1) -> (move_dest=2 | move_dest=0)"
        - "(farmer=2) -> (move_dest=1)"

        # If we finish on next step, then immediately log finished
        - "!(wolf=2 & goat=2 & corn=2) & (wolf'=2 & goat'=2 & corn'=2) -> log_finished_a'"
        - "!(wolf=2 & goat=2 & corn=2) -> !log_finished_a & !finished"

