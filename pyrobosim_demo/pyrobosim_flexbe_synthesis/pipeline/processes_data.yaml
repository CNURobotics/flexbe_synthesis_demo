# Allow us to input custom data into the processing pipeline at start of each run
/data:
    spec_path: 'ros:spec_path'          # Get from ROS 2 launch parameter
    spec_name: 'req:spec_name'          # Use spec_name from the action request
    slugs_specification: {}
    synthesis_timeout_s: 720.0          # Allow long-running demos outside tests
    well_separation_timeout_s: 60.0
    fail_on_non_well_separated: false   # Warn/report but continue synthesis
    fail_on_incomplete: true
    minimize_well_separation_core: false
    strategy_auditor_spec_path: ''      # Empty means use generated compiled .slugsin
    strategy_auditor_goal_outcomes: []  # Empty means derive from mapped SM outcomes
    strategy_auditor_timeout_s: 5.0
    predefined_automaton_path: 'ros:automaton_path'  # Used by load pipeline only
    max_reduction_sweeps: null          # null means sweep reduction until fixed point
    reduced_automaton_name: 'reduced_automaton'
