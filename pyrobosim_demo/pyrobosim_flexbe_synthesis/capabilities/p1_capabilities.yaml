capabilities:
    begin_game:
        interface: LogState
        parameters:
            text: Ready to begin
    log_finished:
        interface: LogState
        parameters:
            text: Everything is in its place
        transition_relation:
            - finished
    move_robot:
        interface: NavigateActionState
        parameters:
            target_location:  '@move_dest'
            robot_name: robot
            action_topic: /execute_action
            server_timeout: 5
            navigate_timeout: None
        transition_relation:
          failure:
            - log_move_failed
    log_move_failed:
        interface: LogState
        parameters:
            text: Error in the previous move
        preconditions:
            - 'move_robot_f'
    grab_item:
        interface: PickActionState
        parameters:
            robot_name: robot
            action_topic: /execute_action
            timeout: 2.5
            object_name: '@pick'
        transition_relation:
          failure:
            - log_grab_failed
    log_grab_failed:
        interface: LogState
        parameters:
            text: Error in the previous grab attempt
        preconditions:
            - 'grab_item_f'
    place_item:
        interface: PlaceActionState
        parameters:
            robot_name: robot
            action_topic: /execute_action
            timeout: 2.5
        transition_relation:
          failure:
            - log_place_failed
    log_place_failed:
        interface: LogState
        parameters:
            text: Error in the previous place attempt
        preconditions:
            - 'place_item_f'
    open:
        interface: DoorActionState
        parameters:
            action_type: 'open'
            robot_name: robot
            action_topic: /execute_action
            timeout: 2.5
        transition_relation:
          failure:
            - log_open_failed
        autonomy:
            # Autonomy level of each named outcome (1=low default)
            execute: 2  # High autonomy requireds
            cancel:  3  # Full autonomy required
    log_open_failed:
        interface: LogState
        parameters:
            text: Error in the previous open attempt
        preconditions:
            - 'open_f'
