/pipeline:
    - entry_point:
        name: system_capabilities_loader
        inputs:
            system_name: NameStr
            slugs_specification: Specification
        outputs:
            system_capabilities: SystemCapabilities
    - entry_point:
        name: slugs_capability_specification
        inputs:
            spec_name: str
            system_capabilities: SystemCapabilities
            # - No input spec here slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    - entry_point:
        name: slugs_transition_system_specification
        inputs:
            spec_name: str
            system_capabilities: SystemCapabilities
            slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    - entry_point:
        name: slugs_spec_loader
        inputs:
            spec_name: NameStr
            system_name: NameStr
            spec_path: FilePathStr # Optional, otherwise use spec name with system_name
            slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    - entry_point:
        name: slugs_request_specification
        inputs:
            spec_name: str
            synthesis_request: FlexBESynthesisRequest
            system_capabilities: SystemCapabilities
            slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    - entry_point:
        name: slugs_system_goal_liveness
        #name: slugs_fair_outcome_liveness
        inputs:
            spec_name: str
            system_capabilities: SystemCapabilities
            slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    # - entry_point:
    #     name: slugs_pending_specification
    #     inputs:
    #         spec_name: str
    #         system_capabilities: SystemCapabilities
    #         slugs_specification: Specification
    #     outputs:
    #         slugs_specification: Specification
    - entry_point:
        name: slugs_activation_specification_parsed
        inputs:
            spec_name: str
            system_capabilities: SystemCapabilities
            slugs_specification: Specification
        outputs:
            slugs_specification: Specification
    - entry_point:
        name: slugs_spec_compiler
        inputs:
            slugs_specification: Specification
            specs_output_dir_path: FilePathStr
        outputs:
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_well_separation_analyzer
        inputs:
            specs_output_dir_path: FilePathStr
            spec_name: NameStr
            well_separation_timeout_s: float
            fail_on_non_well_separated: bool
            fail_on_incomplete: bool
            minimize_well_separation_core: bool
        outputs:
            well_separation_result: dict
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_synthesizer
        inputs:
            specs_output_dir_path: FilePathStr
            state_mappings: Mappings
            synthesis_timeout_s: float
        outputs:
            automaton: Automaton
            error_code: SynthesisErrorCode
    - entry_point:
        name: strategy_auditor
        inputs:
            automaton: Automaton
            specs_output_dir_path: FilePathStr
            spec_name: NameStr
            system_capabilities: SystemCapabilities
            state_mappings: Mappings
            slugs_specification: Specification
            strategy_auditor_spec_path: FilePathStr
            strategy_auditor_goal_outcomes: List[str]
            strategy_auditor_timeout_s: float
        outputs:
            strategy_auditor_result: dict
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_mealy_graph
        inputs:
            automaton: Automaton
            specs_output_dir_path: FilePathStr
            spec_name: NameStr
        outputs:
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_sm_reducer
        inputs:
            automaton: Automaton
            max_reduction_sweeps: None
        outputs:
            reduced_automaton: Automaton
            error_code: SynthesisErrorCode
    - entry_point:
        name: strategy_auditor
        inputs:
            reduced_automaton: Automaton
            specs_output_dir_path: FilePathStr
            spec_name: NameStr
            system_capabilities: SystemCapabilities
            state_mappings: Mappings
            slugs_specification: Specification
            strategy_auditor_spec_path: FilePathStr
            strategy_auditor_goal_outcomes: List[str]
            strategy_auditor_timeout_s: float
        outputs:
            reduced_strategy_auditor_result: dict
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_mealy_graph
        inputs:
            reduced_automaton: Automaton
            specs_output_dir_path: FilePathStr
            reduced_automaton_name: NameStr
        outputs:
            error_code: SynthesisErrorCode
    - entry_point:
        name: slugs_sm_generator
        inputs:
            reduced_automaton: Automaton
            system_name: NameStr
        outputs:
            state_defn: List[StateInstantiation]
            error_code: SynthesisErrorCode
    - entry_point:
        name: sm_layout
        inputs:
            state_defn: List[StateInstantiation]
            specs_output_dir_path: FilePathStr
        outputs:
            state_defn: List[StateInstantiation]
            error_code: SynthesisErrorCode
